# Builds the installable web app on every push to main.
#
# The build always runs and always leaves a downloadable copy of the site on
# the run, so there is a way to get the app out even with no hosting set up.
#
# Deploying to GitHub Pages is switched off by default, because Pages will not
# serve a PRIVATE repository on a free account — the deploy fails at the
# configure step with nothing this workflow can do about it. Two ways to turn
# it on, in Settings -> Secrets and variables -> Actions -> Variables:
#
#   ENABLE_PAGES = true   once the repo is public, or the account is on Pro.
#
# Pages itself also has to be set to build from GitHub Actions rather than from
# a branch, under Settings -> Pages -> Source. On "Deploy from a branch" this
# workflow's deploy job is bypassed entirely and Pages serves the repository
# root, which holds no index.html — so the site comes out as the README or a
# 404 rather than the app.
#
# For a private repo on a free account, host it somewhere that will serve one.
# docs/RELEASE.md section 9 has the walk-through.
name: Web

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  build:
    name: Build the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run web:build
        env:
          EXPO_NO_TELEMETRY: '1'

      # Any host serves one page for every path, so a stale bookmark still
      # opens the app rather than a 404.
      - name: Fall back to the app on any path
        run: cp dist/index.html dist/404.html

      # A custom domain set in the Pages settings is stored against the repo,
      # but an Actions deploy publishes only what is in the artifact — so the
      # CNAME has to travel with the built site or the first deploy drops the
      # domain. Guarded, so taking the CNAME out never breaks the build.
      - name: Keep the custom domain
        run: if [ -f CNAME ]; then cp CNAME dist/CNAME; fi

      # Always downloadable from the run, hosting or not.
      - name: Keep the built site on the run
        uses: actions/upload-artifact@v4
        with:
          name: pipefit-pro-web
          path: dist
          retention-days: 30

      - if: vars.ENABLE_PAGES == 'true'
        uses: actions/configure-pages@v5
      - if: vars.ENABLE_PAGES == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy to Pages
    needs: build
    if: vars.ENABLE_PAGES == 'true'
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4

# Build and publish from a phone.
#
# Everything here runs on GitHub's machines, so a build needs nothing installed
# and nothing left plugged in. A merge into main pushes an update by itself:
# merge the pull request in the GitHub app, reopen PipeFit twice, done. For an
# APK, or an update by hand, open the Actions tab, pick this workflow and press
# Run workflow.
#
# One secret makes it work: EXPO_TOKEN, from expo.dev under Account settings,
# Access tokens. Put it in Settings, Secrets and variables, Actions. Until it
# is there a merge only notes that it is missing; a run by hand fails and says
# so.

name: Build

on:
  # What changes the app on the phone. The Worker deploys itself through
  # Cloudflare, and the docs and the lab tools never reach the phone.
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - 'tools/**'
      - 'worker/**'
      - 'wrangler.jsonc'
      - '.github/workflows/ci.yml'
      - '.github/workflows/web.yml'
  workflow_dispatch:
    inputs:
      what:
        description: What to send
        required: true
        default: update
        type: choice
        options:
          - update
          - apk
      profile:
        description: Which build profile
        required: true
        default: preview
        type: choice
        options:
          - preview
          - production

# One at a time, in order: two merges close together publish one after the
# other rather than racing, and the later one is what the phone ends up with.
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # The secrets context is not readable from a job's or a step's `if`, so the
  # check is a job that reads it through the environment and says what it saw.
  token:
    name: Expo token
    runs-on: ubuntu-latest
    outputs:
      ok: ${{ steps.check.outputs.ok }}
    steps:
      - id: check
        env:
          EXPO_TOKEN: ${{ secrets.EXPO_TOKEN }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ -n "$EXPO_TOKEN" ]; then
            echo "ok=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "ok=false" >> "$GITHUB_OUTPUT"
          MSG="Add an Expo access token as the repository secret EXPO_TOKEN. Make one at https://expo.dev under Account settings, Access tokens, then add it under Settings, Secrets and variables, Actions."
          if [ "$EVENT" = "workflow_dispatch" ]; then
            echo "::error title=No EXPO_TOKEN::$MSG"
            exit 1
          fi
          # A merge is not a request to publish, so it does not fail over it.
          echo "::notice title=No update pushed::$MSG"

  send:
    needs: token
    if: needs.token.outputs.ok == 'true'
    name: ${{ (inputs.what || 'update') == 'apk' && 'Build an APK' || 'Push an update' }}
    runs-on: ubuntu-latest
    # A merge has no inputs: it is an update to the preview channel, the one
    # the installed APK listens on.
    env:
      WHAT: ${{ inputs.what || 'update' }}
      PROFILE: ${{ inputs.profile || 'preview' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      # The same gate the CI workflow runs. A broken build is worse on a phone
      # than on a desk, because the phone is where it gets noticed last.
      - name: Typecheck
        run: npm run typecheck

      - name: Unit tests
        run: npm test -- --ci

      - uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      # An update only reaches a phone whose installed APK carries the same
      # runtime version. Recorded here so the log says which one it went to.
      #
      # This is the project's own script, which asks expo-updates to resolve
      # it. That is the number the app compares against, and it is not the one
      # a bare `@expo/fingerprint` run prints.
      - name: Runtime version
        id: rv
        run: echo "hash=$(npm run runtime-version --silent | tail -1)" >> "$GITHUB_OUTPUT"

      # The message is the commit hash, through the environment: a merge runs
      # this too now, and a commit message is text anyone who can open a pull
      # request writes, so it never goes near the shell.
      - name: Push an update
        if: env.WHAT == 'update'
        env:
          MESSAGE: ${{ github.sha }}
        run: eas update --branch "$PROFILE" --message "$MESSAGE" --non-interactive

      # --no-wait returns as soon as the build is queued. Waiting would hold an
      # Actions runner for the length of an Android build, and the queue page
      # already shows the progress better than a log does.
      - name: Build an APK
        if: env.WHAT == 'apk'
        run: eas build --platform android --profile "$PROFILE" --non-interactive --no-wait

      - name: Where to look
        env:
          RV: ${{ steps.rv.outputs.hash }}
        run: |
          {
            if [ "$WHAT" = "apk" ]; then echo "### APK queued"; else echo "### Update pushed"; fi
            echo
            echo "| | |"
            echo "|-|-|"
            echo "| Profile | \`$PROFILE\` |"
            echo "| Commit | \`${GITHUB_SHA:0:7}\` |"
            echo "| Runtime version | \`$RV\` |"
            echo
            if [ "$WHAT" = "apk" ]; then
              echo "The build is queued, not finished. Watch it, and scan its QR when it is done, at:"
              echo
              echo "<https://expo.dev/accounts/[account]/projects/pipefit-pro/builds>"
              echo
              echo "An APK is only needed when the runtime version above differs from the one your installed app was built with. Otherwise an update is enough, and is instant."
            else
              echo "The update is live. Reopen the app twice to take it."
              echo
              echo "It reaches only phones whose installed APK carries the runtime version above. If yours does not, build an APK instead."
            fi
          } >> "$GITHUB_STEP_SUMMARY"

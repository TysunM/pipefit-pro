# Publishes the web build to GitHub Pages on every push to main.
#
# This is how the crew gets the app without a store, a keystore or an Apple
# Developer account: they open the link once and add it to their home screen.
# It installs the same way on an iPhone as on an Android.
#
# One-time setup: repository Settings -> Pages -> Source: GitHub Actions.
name: Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# A deploy in flight is not cancelled — half a site is worse than an old one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the web app
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: npm run web:build
        env:
          EXPO_NO_TELEMETRY: '1'

      # Pages serves 404.html for any unknown path. The app is one page, so
      # pointing that at the app means a stale bookmark still opens it.
      - name: Fall back to the app on any path
        run: cp dist/index.html dist/404.html

      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
